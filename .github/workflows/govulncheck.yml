name: govulncheck

# The image only contains the binary, and the standard library is fixed when it is built. Every
# week the latest released image is checked against Go's vulnerability database, and in a PR the
# image the PR builds. A failure here means: raise the Go version in Dockerfile and release a patch.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the binary from the image
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            image=karakeep-opds:pr
            docker build -q -t "$image" .
          else
            image="ghcr.io/$GITHUB_REPOSITORY:$(cat VERSION)"
          fi
          echo "Scanning $image"
          docker create --name scan "$image" >/dev/null
          docker cp scan:/karakeep-opds ./karakeep-opds
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary ./karakeep-opds
